version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - dupl
    - nolintlint
  settings:
    dupl:
      threshold: 150 # tokens; golangci-lint default
    nolintlint:
      require-explanation: true # a bare //nolint:x with no reason is as bad as no comment
      require-specific: true # forbid bare //nolint; must name the linter(s)

formatters:
  enable:
    - gofmt
run:
  # CI hosts run several runners; golangci-lint's default single-instance lock
  # trips ("parallel golangci-lint is running") when two lint jobs overlap on
  # one host. Caches are per-runner-home, so parallel runs are safe.
  allow-parallel-runners: true
